<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구성원 · CSP Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="people">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>구성원</h1>
        <p>[연구실 구성원을 소개하는 문구]</p>
      </div>
    </div>

    <section>
      <div class="container">
        <h2 class="section-title">지도교수</h2>
        <div class="grid">
          <div class="card member-card">
            <img class="member-photo" src="assets/images/members/pi.jpg" alt="[지도교수 이름]" />
            <h3>[지도교수 이름]</h3>
            <p class="member-role">[직함, 예: 교수]</p>
            <p>[간단한 소개 / 학력 / 연구 관심사]</p>
            <p class="member-links">
              <a href="mailto:[email@example.com]">이메일</a>
              <a href="[개인 홈페이지 URL]">홈페이지</a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title">대학원생</h2>
        <div class="grid">
          <div class="card member-card">
            <img class="member-photo" src="assets/images/members/placeholder.jpg" alt="[이름]" />
            <h3>[이름]</h3>
            <p class="member-role">[과정, 예: 박사과정 / 석사과정]</p>
            <p class="member-links">
              <a href="mailto:[email@example.com]">이메일</a>
            </p>
          </div>
          <!-- 구성원 카드를 복제해서 추가하세요 -->
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title">졸업생</h2>
        <div class="grid">
          <div class="card">
            <h3>[이름]</h3>
            <p>[졸업년도, 학위, 현재 소속 등]</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
