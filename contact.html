<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연락처 · CSP Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contact">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>연락처 / 오시는 길</h1>
        <p>[연구실 위치 및 연락처 안내]</p>
      </div>
    </div>

    <section>
      <div class="container contact-grid">
        <div>
          <h2 class="section-title">연락처</h2>
          <p><strong>주소</strong><br />[학교명] [단과대/학과명]<br />[상세 주소]</p>
          <p><strong>이메일</strong><br /><a href="mailto:[email@example.com]">[email@example.com]</a></p>
          <p><strong>전화</strong><br />[전화번호]</p>
        </div>
        <div>
          <h2 class="section-title">오시는 길</h2>
          <!-- 지도를 iframe으로 임베드하려면 아래 주석을 해제하고 src를 채워 넣으세요 -->
          <!-- <iframe class="map-embed" src="[지도 임베드 URL]" loading="lazy"></iframe> -->
          <div class="map-embed" style="display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);">
            [지도를 여기에 삽입하세요]
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
